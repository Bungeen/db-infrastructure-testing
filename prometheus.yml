global:
  scrape_interval: 5s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  - job_name: 'backup-exporter'
    static_configs:
      - targets: ['backup_job:8080']